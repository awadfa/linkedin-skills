name: Python tests (free offline)

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  push:
    branches:
      - dev/real-estate-content-clay
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test dependencies
        run: python -m pip install requests PyYAML python-dotenv
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check real estate CLI
        run: |
          python scripts/real_estate_workspace.py --help
          python scripts/real_estate_workspace.py content-plan --start 2026-11-10 --audience "Dubai investors"
